<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METATORI WORLD | DREAM PORTAL</title><style>*{box-sizing:border-box}body{margin:0;background:#080716;color:white;font-family:system-ui,sans-serif;text-align:center;overflow-x:hidden;min-height:100dvh}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}header{padding:25px;letter-spacing:5px;font-weight:900;font-size:14px}small{letter-spacing:4px;color:#c7b9ff}h1{font-size:clamp(32px,6vw,60px);line-height:1.15;margin:14px 0;text-shadow:0 0 35px #9b7aff88}p{color:#c6bddb;line-height:1.8}.stage{height:clamp(380px,55vh,560px);perspective:950px;position:relative;touch-action:pan-y;overflow:hidden;cursor:grab}.card{position:absolute;left:50%;top:8%;width:clamp(190px,48vw,270px);height:82%;margin-left:calc(clamp(190px,48vw,270px) / -2);border-radius:30px;border:1px solid #ffffff88;background:radial-gradient(circle at 50% 30%,var(--c),#100d26 75%);box-shadow:0 0 35px var(--c),0 35px 70px #000b,inset 0 0 30px #ffffff18;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;will-change:transform;cursor:pointer}.card:before{content:'';position:absolute;inset:8px;border:1px solid #ffffff33;border-radius:24px;pointer-events:none}.orb{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:58px;background:radial-gradient(circle at 30% 20%,#fff,var(--c) 22%,#17132d 78%);box-shadow:0 0 45px var(--c),inset -10px -12px 20px #0008;animation:float 3s ease-in-out infinite}.card h2{font-size:25px;margin:25px 0 6px}.card span{font-size:10px;letter-spacing:3px}.ring{position:absolute;left:50%;bottom:0;width:300px;height:85px;border:2px solid #ad8aff99;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 25px #a16bff,inset 0 0 25px #a16bff;pointer-events:none;z-index:-1;animation:pulse 3s infinite}.controls button,.detail button{border:1px solid #ffffff66;background:#ffffff12;color:white;padding:12px 25px;border-radius:30px;font:inherit;cursor:pointer}.dots button{width:9px;height:9px;border:0;border-radius:50%;background:#6a6087;margin:7px;padding:0}.dots button.active{background:#fff;box-shadow:0 0 15px #fff}.overlay{position:fixed;inset:0;z-index:20;background:#080716e8;backdrop-filter:blur(14px);display:grid;place-items:center;padding:24px;opacity:0;visibility:hidden;transition:.45s}.overlay.open{opacity:1;visibility:visible}.detail{max-width:520px;padding:36px;border-radius:30px;border:1px solid #bfa4ff88;background:radial-gradient(ellipse at top,#463477,#151027);box-shadow:0 0 90px #9565ff55;transform:scale(.2) rotateY(65deg);transition:.65s cubic-bezier(.2,.8,.2,1)}.open .detail{transform:none}.flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:30}.flash.go{animation:flash .65s ease-out}footer{font-size:12px;color:#a69aba;padding:16px}@keyframes flash{0%{opacity:.85}100%{opacity:0}}@keyframes float{50%{transform:translateY(-12px) rotate(-5deg)}}@keyframes pulse{50%{opacity:.5;scale:1.12}}@media(prefers-reduced-motion:reduce){.orb,.ring,.flash{animation:none}.detail{transition:none}}</style><body><canvas id="sky"></canvas><header>METATORI WORLD</header><small>ENTER THE DREAM PORTAL</small><h1>당신의 꿈이<br>살아가는 세상.</h1><p>손끝으로 새로운 세계를 열어보세요.</p><div class="stage" id="stage"><div class="ring"></div></div><div class="controls"><button id="prev" aria-label="이전">‹</button> <button id="enter">세계 입장 →</button> <button id="next" aria-label="다음">›</button></div><div class="dots" id="dots"></div><footer>좌우 드래그 · 카드 선택<br><br>모든 꿈은 평등하다.</footer><div class="overlay" id="overlay"><div class="detail"><small>DREAM PORTAL</small><h1 id="title"></h1><p id="desc"></p><button id="close">← 돌아가기</button></div></div><div class="flash" id="flash"></div><script>const data=[['세계관','✧','#8161e8','사람들의 꿈으로 만들어지는 또 하나의 세계. 선물 받은 꿈은 새로운 메타토리로 태어나 살아갑니다.'],['메타토리','♡','#328df5','오복박쥐에서 영감을 받은 꿈꾸는 아기 박쥐. 모든 꿈을 편견과 차별 없이 받아들입니다.'],['드림카드','▣','#e66ac1','꿈이 이루어진 가장 아름다운 순간을 담은 세상에 하나뿐인 작품. 누구나 무료로 꿈을 선물할 수 있습니다.'],['꿈의 수집','✦','#e7ad50','색상을 모아 특별한 메타토리를 탄생시키는 수집의 즐거움. 꿈에는 등급이 없습니다.'],['갤러리','◇','#36bfae','사람들의 꿈으로 탄생한 메타토리 작품을 만나는 공간입니다. 작품 공개 준비 중입니다.']];const stage=document.querySelector('#stage'),dots=document.querySelector('#dots'),cards=[];let pos=0,target=0,down=false,start=0,base=0,moved=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function openCard(i){document.querySelector('#title').textContent=data[i][0];document.querySelector('#desc').textContent=data[i][3];const f=document.querySelector('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');document.querySelector('#overlay').classList.add('open')}function select(i){target+=((i-Math.round(target)%5+7)%5)-2}data.forEach((d,i)=>{let b=document.createElement('button');b.className='card';b.style.setProperty('--c',d[2]);b.innerHTML='<div class="orb">'+d[1]+'</div><h2>'+d[0]+'</h2><span>DISCOVER YOUR DREAM</span>';b.onclick=()=>{if(moved)return;if(((Math.round(target)%5)+5)%5===i)openCard(i);else select(i)};stage.append(b);cards.push(b);let dot=document.createElement('button');dot.setAttribute('aria-label',d[0]);dot.onclick=()=>select(i);dots.append(dot)});function animate(){pos+= (target-pos)*(down?.42:.12);if(reduced)pos=target;cards.forEach((e,i)=>{let n=((i-pos+2.5)%5+5)%5-2.5;let a=n*Math.PI*2/5;e.style.transform='translate3d('+Math.sin(a)*Math.min(innerWidth*.43,390)+'px,0,'+((Math.cos(a)-1)*470)+'px) rotateY('+(-Math.sin(a)*32)+'deg) scale('+(.68+.48*(Math.cos(a)+1)/2)+')';e.style.zIndex=10+Math.round(Math.cos(a)*8);e.style.opacity=(.48+.52*(Math.cos(a)+1)/2);dots.children[i].classList.toggle('active',Math.abs(n)<.5)});requestAnimationFrame(animate)}stage.addEventListener('pointerdown',e=>{down=true;start=e.clientX;base=target;moved=false});window.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-start;if(Math.abs(dx)>10)moved=true;if(moved)target=base-dx/130});function end(){if(!down)return;down=false;target=Math.round(target);setTimeout(()=>moved=false,100)}window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);document.querySelector('#prev').onclick=()=>target=Math.round(target)-1;document.querySelector('#next').onclick=()=>target=Math.round(target)+1;document.querySelector('#enter').onclick=()=>openCard((Math.round(target)%5+5)%5);document.querySelector('#close').onclick=()=>document.querySelector('#overlay').classList.remove('open');animate();const cv=document.querySelector('#sky'),ctx=cv.getContext('2d');let w,h;function resize(){w=cv.width=innerWidth;h=cv.height=innerHeight}resize();addEventListener('resize',resize);let stars=Array.from({length:260},()=>[Math.random()*2-1,Math.random()*2-1,Math.random()]);function sky(){ctx.fillStyle='#080716';ctx.fillRect(0,0,w,h);let g=ctx.createRadialGradient(w/2,h*.48,0,w/2,h*.48,Math.max(w,h)*.65);g.addColorStop(0,'#51367e');g.addColorStop(.5,'#1a1238');g.addColorStop(1,'#050412');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let j=0;j<9;j++){let x=w*(.08+j*.105),y=h*(.23+j*.055+Math.sin(j*1.7)*.12),r=Math.max(w,h)*(.18+j%3*.04);let neb=ctx.createRadialGradient(x,y,0,x,y,r);neb.addColorStop(0,['#a44ac82a','#397bdc35','#e278bd26'][j%3]);neb.addColorStop(.45,['#6a38b21c','#3155ac22','#a04b991c'][j%3]);neb.addColorStop(1,'#00000000');ctx.fillStyle=neb;ctx.fillRect(0,0,w,h)}stars.forEach(s=>{if(!reduced)s[2]-=.00065;if(s[2]<.03)s[2]=1;let x=w/2+s[0]*w*.55/s[2],y=h/2+s[1]*h*.55/s[2];ctx.fillStyle='rgba(220,205,255,'+(1-s[2])+')';ctx.beginPath();ctx.arc(x,y,Math.min(3,1/s[2]*.5),0,Math.PI*2);ctx.fill()});requestAnimationFrame(sky)}sky()</script></body></html>
