<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METATORI WORLD 3D</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#393268,#100d24 70%);color:white;font-family:system-ui,sans-serif;min-height:100dvh;text-align:center;overflow-x:hidden}header{padding:24px;letter-spacing:4px;font-weight:800}h1{font-size:clamp(28px,6vw,48px);margin:20px 0 8px}p{color:#c9c1e4;line-height:1.7}small{letter-spacing:3px;color:#c6b5ff}.stage{height:350px;position:relative;perspective:950px;touch-action:pan-y;overflow:hidden;cursor:grab}.card{position:absolute;top:30px;left:50%;width:210px;height:280px;margin-left:-105px;border:1px solid #ffffff66;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 60px #0008;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .5s;background:linear-gradient(145deg,var(--c),#17152f);color:white;cursor:pointer}.card b{font-size:75px;text-shadow:0 0 35px #fff8}.card h2{margin:18px 0 5px}.card span{font-size:12px;color:#eee}button{border:1px solid #ffffff55;background:#ffffff15;color:white;border-radius:30px;padding:12px 22px;font:inherit;cursor:pointer}.dots{margin:15px}.dots button{padding:0;width:9px;height:9px;margin:5px;background:#777}.dots button.active{background:white;box-shadow:0 0 12px white}.stars{position:fixed;inset:0;pointer-events:none;z-index:-1}.stars i{position:absolute;background:white;border-radius:50%;width:2px;height:2px;box-shadow:0 0 7px white}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#100d24e8;backdrop-filter:blur(15px);padding:24px;opacity:0;visibility:hidden;transition:.4s}.overlay.open{opacity:1;visibility:visible}.detail{max-width:500px;background:#292343;border:1px solid #ffffff44;padding:35px;border-radius:30px;transform:scale(.7) translateY(60px);transition:.5s}.open .detail{transform:none}footer{padding:25px;font-size:12px;color:#aaa}</style><body><div class="stars"></div><header>METATORI WORLD</header><small>THE WORLD OF DREAMS</small><h1>당신의 꿈이<br>살아가는 세상.</h1><p>손끝으로 꿈의 세계를 탐험하세요.</p><div class="stage" id="stage"></div><button id="prev" aria-label="이전">‹</button> <button id="next" aria-label="다음">›</button><div class="dots" id="dots"></div><p>좌우로 드래그 · 카드를 눌러 입장</p><footer>모든 꿈은 평등하다.</footer><div class="overlay" id="overlay"><div class="detail"><small>METATORI WORLD</small><h1 id="title"></h1><p id="desc"></p><button id="close">돌아가기</button></div></div><script>const data=[['세계관','✧','#6252ae','사람들의 꿈으로 만들어지는 또 하나의 세계. 당신이 선물한 꿈은 새로운 메타토리로 태어나 살아갑니다.'],['메타토리','♡','#3166a8','오복박쥐에서 영감을 받은 꿈꾸는 아기 박쥐. 모든 꿈을 편견과 차별 없이 받아들입니다.'],['드림카드','▣','#a65086','꿈이 이루어진 가장 아름다운 순간을 담은 세상에 하나뿐인 작품. 누구나 무료로 자신의 꿈을 선물할 수 있습니다.'],['꿈의 수집','✦','#99713d','색상을 모아 새로운 메타토리를 탄생시키는 특별한 수집의 즐거움. 꿈에는 등급이 존재하지 않습니다.'],['갤러리','◇','#327f80','사람들의 꿈으로 탄생한 메타토리 작품을 만나는 공간입니다. 작품 공개 준비 중입니다.']];let current=0,start=0,drag=false;const stage=document.getElementById('stage'),dots=document.getElementById('dots');data.forEach((d,i)=>{const b=document.createElement('button');b.className='card';b.style.setProperty('--c',d[2]);b.innerHTML='<b>'+d[1]+'</b><h2>'+d[0]+'</h2><span>EXPLORE →</span>';b.onclick=()=>{if(drag)return;if(current!==i){current=i;render()}else{document.getElementById('title').textContent=d[0];document.getElementById('desc').textContent=d[3];document.getElementById('overlay').classList.add('open')}};stage.append(b);const dot=document.createElement('button');dot.setAttribute('aria-label',d[0]);dot.onclick=()=>{current=i;render()};dots.append(dot)});function render(){[...stage.children].forEach((e,i)=>{let n=(i-current+data.length)%data.length;if(n>2)n-=5;e.style.transform='translateX('+n*145+'px) translateZ('+(-Math.abs(n)*130)+'px) rotateY('+(-n*30)+'deg)';e.style.zIndex=5-Math.abs(n);e.style.opacity=Math.abs(n)>1?.25:1;dots.children[i].classList.toggle('active',i===current)})}function move(n){current=(current+n+5)%5;render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);stage.addEventListener('pointerdown',e=>{start=e.clientX;drag=false});stage.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-start)>35){drag=true;move(e.clientX<start?1:-1);setTimeout(()=>drag=false,250)}});document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');for(let i=0;i<70;i++){let s=document.createElement('i');s.style.left=(i*137.51%100)+'%';s.style.top=(i*73.19%100)+'%';s.style.opacity=.25+i%5/7;document.querySelector('.stars').append(s)}render()</script></body></html>
